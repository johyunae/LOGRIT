plugins { id 'com.android.application' }

android {
    namespace 'com.logrit.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.logrit.app'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.0.0.3'
        resValue 'string', 'app_name', 'LOGRIT'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', 'LOGRIT 테스트'
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.android.gms:play-services-ads:24.6.0'
}
