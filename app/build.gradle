plugins { id 'com.android.application' }

android {
    namespace 'com.logrit.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.logrit.app'
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName '1.0.0.11'
        resValue 'string', 'app_name', 'LOGRIT'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', 'LOGRIT 테스트'
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.android.gms:play-services-ads:24.6.0'
    // Override the obsolete transitive Fragment 1.1.0 flagged by Play Console.
    implementation 'androidx.fragment:fragment:1.8.9'
}
